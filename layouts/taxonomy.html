{{- define "main" }}
<div class="tags-container">
    <header class="page-header">
        <h1 class="page-title">{{ .Title | default "Tags" }}</h1>
        {{- with .Description }}
        <div class="page-description">{{ . }}</div>
        {{- end }}
    </header>

    {{- if .Data.Terms }}
    <ul class="terms-tags" aria-label="Tags list">
        {{- range .Data.Terms.Alphabetical }}
            {{- $count := .Count }}
            <li>
                <a href="{{ .Page.RelPermalink }}" class="tag-link"><span class="tag-name">#{{ .Page.Title }}</span> <span class="tag-count">({{ $count }})</span></a>
            </li>
        {{- end }}
    </ul>
    {{- else }}
    <p class="empty-state">No tags found.</p>
    {{- end }}
</div>
{{- end }}
