name: Deploy Hugo site to Pages

on:
  push:
    # "hugo" is the staging branch used for the first cutover from the legacy
    # Jekyll site, and remains available for previewing a deploy from a branch.
    branches: ["master", "hugo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # themes/PaperMod is a submodule
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # Do NOT override --baseURL with steps.pages.outputs.base_url here.
        # That value is the github.io project URL unless the repository already
        # has the custom domain configured in Pages settings, so overriding it
        # silently publishes canonicals, sitemap entries and RSS links pointing
        # at the wrong host. hugo.yaml already pins the real origin
        # (https://diasdiaz.net/), which is the custom domain the CNAME file
        # declares, so let the config win.
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
