<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <!-- Outer cover background and border -->
  <rect x="1" y="1" width="118" height="178" rx="2" fill="#EFEFEA" stroke="#454545" stroke-width="2"/>
  
  <!-- Film reel / frame header banner -->
  <rect x="1" y="1" width="118" height="14" fill="#333333"/>
  <rect x="8" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="24" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="40" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="56" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="72" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="88" y="4" width="8" height="6" fill="#EFEFEA"/>
  <rect x="104" y="4" width="8" height="6" fill="#EFEFEA"/>

  <!-- Geometric architectural / camera frame -->
  <g transform="translate(16, 28)">
    <rect x="0" y="0" width="88" height="74" fill="#E2E2DC" stroke="#454545" stroke-width="1.5"/>
    <!-- Glass monolith grid -->
    <line x1="22" y1="0" x2="22" y2="74" stroke="#7A9A95" stroke-width="1"/>
    <line x1="44" y1="0" x2="44" y2="74" stroke="#7A9A95" stroke-width="1"/>
    <line x1="66" y1="0" x2="66" y2="74" stroke="#7A9A95" stroke-width="1"/>
    <line x1="0" y1="24" x2="88" y2="24" stroke="#7A9A95" stroke-width="1"/>
    <line x1="0" y1="48" x2="88" y2="48" stroke="#7A9A95" stroke-width="1"/>
    <!-- Center focal lens / highlight -->
    <circle cx="44" cy="36" r="14" fill="#D97D64" opacity="0.85" stroke="#454545" stroke-width="1.5"/>
    <circle cx="44" cy="36" r="5" fill="#FAF9F6"/>
  </g>

  <!-- Title lines -->
  <rect x="16" y="116" width="88" height="6" fill="#454545"/>
  <rect x="16" y="126" width="56" height="4" fill="#6B6069"/>

  <!-- Label badge -->
  <g transform="translate(16, 146)">
    <rect x="0" y="0" width="40" height="14" rx="1" fill="#EFEFEA" stroke="#D97D64" stroke-width="1"/>
    <text x="20" y="10" font-family="ui-monospace, monospace" font-size="8" fill="#A8452E" font-weight="bold" text-anchor="middle" letter-spacing="1">FILM</text>
  </g>
</svg>
