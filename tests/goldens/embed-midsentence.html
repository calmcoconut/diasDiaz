<p>A card cannot live inside a sentence, so <a class="wikilink" href="/blog/embed-target/" data-preview-title="Embed target note" data-preview-date="2021-03-09" data-preview-excerpt="Body of the embedded note. Its first sentence becomes the card excerpt, so it must stay plain text with no Obsidian syntax in it." title="Embed target note (2021-03-09)">Embed target note</a> renders as an

design (§9 trap 3) and a golden file must never enshrine that.</p>
